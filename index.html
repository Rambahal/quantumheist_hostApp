<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Heist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at center, #141a2e 0%, #0b0f1a 70%);
      color: #e6e8f0;
      text-align: center;
      overflow: hidden;
    }
    .loader {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 2rem;
    }
    .loader .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: spin 3s linear infinite;
    }
    .loader .ring:nth-child(1) { border-top-color: #7c5cff; }
    .loader .ring:nth-child(2) { inset: 18px; border-right-color: #00e5ff; animation-duration: 2s; animation-direction: reverse; }
    .loader .ring:nth-child(3) { inset: 36px; border-bottom-color: #ff4fd8; animation-duration: 1.4s; }
    .loader .core {
      position: absolute;
      inset: 54px;
      border-radius: 50%;
      background: #7c5cff;
      box-shadow: 0 0 20px #7c5cff, 0 0 60px #00e5ff;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #7c5cff, #00e5ff, #ff4fd8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { color: #9aa3b8; margin: 0; }
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
    footer {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.85rem;
      color: #6b7390;
    }
  </style>
</head>
<body>
  <div class="loader" aria-hidden="true">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="core"></div>
  </div>
  <main>
    <h1>Quantum Heist</h1>
    <p class="dots">Initializing</p>
  </main>
  <footer>Managed by Ram Tiwari</footer>
</body>
</html>
